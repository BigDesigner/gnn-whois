name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Version Override (Optional, e.g., 0.1.1). If empty, version will be read from gnn-whois.php'
        required: false
        default: ''

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write


    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Extract Version from gnn-whois.php
        id: get_version
        run: |
          VERSION_INPUT="${{ github.event.inputs.version_override }}"
          if [ -n "$VERSION_INPUT" ]; then
            VERSION="$VERSION_INPUT"
          else
            VERSION=$(grep -m 1 "Version:" gnn-whois/gnn-whois.php | awk '{print $NF}')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Zip
        run: |
          # The repo root now mirrors the plugin package: the gnn-whois/
          # folder can be zipped directly, no build/rsync step needed.
          ZIP_NAME="gnn-whois-${{ env.VERSION }}.zip"
          zip -r "$ZIP_NAME" gnn-whois
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
